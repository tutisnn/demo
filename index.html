<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toprak Şeker Demo Asistan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Düzen: tek sütun telefon boyutunda sohbet, yanında devir özeti paneli (geniş ekranda) */
:root{
  --bg:#f4f0ee; --panel:#ffffff; --ink:#241a22; --muted:#7a6b76; --line:#e5dcd9;
  --accent:#6b2d5c; --accent-ink:#ffffff; --me:#e9dbe5; --bot:#ffffff; --ok:#2e7d4f;
  --display:'Fraunces',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181216; --panel:#241c22; --ink:#f1e8ee; --muted:#a99aa5; --line:#3a2e37;
    --accent:#c27bb0; --accent-ink:#1a1018; --me:#4a2d43; --bot:#2d232b; --ok:#6fcf97; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181216; --panel:#241c22; --ink:#f1e8ee; --muted:#a99aa5; --line:#3a2e37;
  --accent:#c27bb0; --accent-ink:#1a1018; --me:#4a2d43; --bot:#2d232b; --ok:#6fcf97; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;justify-content:center;padding:16px;gap:16px}
.chat{width:100%;max-width:440px;height:100%;max-height:820px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 17px var(--display)}
header h1{font:600 17px var(--display);margin:0}
header small{color:var(--muted);display:block;font-size:12px}
header button{margin-left:auto}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.m{max-width:82%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:4px}
.m img{display:block;max-width:200px;border-radius:8px;margin-bottom:6px}
.sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip,button{font:500 13px var(--body);cursor:pointer}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 11px}
.chip:hover{border-color:var(--accent)}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:15px/1.4 var(--body);background:var(--bg);color:var(--ink);max-height:110px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:600}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px}
.btn:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{width:300px;flex:none;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.side h2{font:600 16px var(--display);margin:0 0 4px}
.side p{margin:0 0 12px;color:var(--muted);font-size:13px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.typing{color:var(--muted)}
@media (max-width:820px){.side{display:none} body{padding:0} .chat{max-height:none;border-radius:0;border:0}}
@media (prefers-reduced-motion:no-preference){.m{animation:in .15s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<main class="chat" aria-label="Demo sohbet">
  <header>
    <div class="av" aria-hidden="true">T</div>
    <div><h1>Toprak Şeker Hair</h1><small>Demo asistan · yapay zekâ</small></div>
    <button class="ghost" id="reset" type="button">Yeniden başlat</button>
  </header>
  <div class="log" id="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="bar" id="form">
    <input type="file" id="file" accept="image/*" hidden>
    <button class="ghost" id="attach" type="button" title="Saç fotoğrafı ekle">Foto</button>
    <textarea id="input" rows="1" placeholder="Mesaj yazın" aria-label="Mesaj"></textarea>
    <button class="btn" id="send" type="submit">Gönder</button>
  </form>
</main>
<aside class="side" aria-label="Satış ekibine giden özet">
  <h2>Satış ekibi özeti</h2>
  <p>Asistan devir yaptığında müşteri bilgileri burada görünür. Gerçek sistemde bu özet CRM'e yazılır.</p>
  <div style="margin-bottom:12px"><span class="pill" id="state">Devir bekliyor</span></div>
  <dl id="sum"></dl>
</aside>

<script>
// Webhook adresi. n8n'de akışı yayınladıktan sonra "Production URL" ile aynı olmalı.
const WEBHOOK_URL = "https://n8n.closerone.ai/webhook/20f81804-7782-49ca-9667-a08353339626/toprak-seker-demo";
const MAX_USER_MESSAGES = 30;

const LABELS={musteri_tipi:'Müşteri tipi',ulke:'Ülke',teknik:'Teknik',uzunluk:'Uzunluk',renk:'Renk',fotograf:'Fotoğraf',devir_nedeni:'Devir nedeni',dil:'Dil',not:'Not'};
const $=id=>document.getElementById(id);
let msgs=[], busy=false, done=false, userCount=0, photo=null;
const PHOTO_NOTE=' [Müşteri saç fotoğrafı gönderdi. Fotoğraf satış ekibine iletildi; yorum yapma, teşekkür et ve sohbete devam et.]';

function add(role,text,imgUrl){
  const d=document.createElement('div'); d.className='m '+(role==='user'?'me':'bot');
  if(imgUrl){const i=document.createElement('img');i.src=imgUrl;i.alt='Gönderilen fotoğraf';d.appendChild(i)}
  const s=document.createElement('span'); s.textContent=text; d.appendChild(s);
  $('log').appendChild(d); $('log').scrollTop=1e9; return s;
}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}

function fillSummary(o){
  const dl=$('sum'); dl.textContent='';
  for(const k in LABELS){ if(o&&o[k]!==undefined){const a=document.createElement('dt');a.textContent=LABELS[k];const b=document.createElement('dd');b.textContent=String(o[k]);dl.append(a,b)} }
  $('state').textContent='Satış ekibine devredildi'; $('state').className='pill ok';
}

async function send(text){
  if(busy||done) return; text=text.trim(); if(!text&&!photo) return;
  if(userCount>=MAX_USER_MESSAGES){sys('Bu demo için mesaj sınırına ulaşıldı. Yeniden başlatın.');return}
  busy=true; $('send').disabled=true; userCount++;
  const pUrl=photo?URL.createObjectURL(photo):null; const hadPhoto=!!photo; photo=null;
  add('user',text||'(fotoğraf)',pUrl); msgs.push({role:'user',text:(text||'')+(hadPhoto?PHOTO_NOTE:'')});
  $('input').value=''; $('chips').textContent='';
  const out=add('bot','…'); out.className='typing';
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),60000);
    const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs}),signal:ctrl.signal});
    clearTimeout(to);
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    const reply=String(data.reply||'').trim();
    if(!reply) throw new Error('empty');
    out.className=''; out.textContent=reply; msgs.push({role:'assistant',text:reply});
    if(data.handoff){
      done=true; fillSummary(data.summary||{});
      sys('Sohbet satış ekibine devredildi.'); $('input').disabled=true;
    }
  }catch(e){
    out.parentNode.remove(); msgs.pop(); userCount--;
    sys('Cevap alınamadı. Birkaç saniye sonra tekrar deneyin.');
  }
  busy=false; $('send').disabled=false; if(!done) $('input').focus();
}

function reset(){
  msgs=[];done=false;userCount=0;photo=null;$('log').textContent='';$('input').disabled=false;$('input').value='';
  $('sum').textContent='';$('state').textContent='Devir bekliyor';$('state').className='pill';
  sys('Demo sohbet. Müşteri gibi yazın; asistan Toprak Şeker Hair adına cevap verir.');
  const c=$('chips');c.textContent='';
  ['Merhaba, saç extension fiyatları nedir?','Kuaförüm, toptan saç almak istiyorum','Hello, I want hair extensions','Sen yapay zeka mısın?'].forEach(t=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)});
}

$('form').addEventListener('submit',e=>{e.preventDefault();send($('input').value)});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('input').value)}});
$('reset').onclick=reset;
$('attach').onclick=()=>$('file').click();
$('file').onchange=e=>{photo=e.target.files[0]||null; e.target.value=''; if(photo) sys('Fotoğraf eklendi. Mesajınızla birlikte gönderilecek.')};
reset();
</script>
</body>
</html>
